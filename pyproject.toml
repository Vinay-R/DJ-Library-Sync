[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dj-library-sync"
version = "0.1.0"
description = "Read-only Spotify to TIDAL recording matcher with a SQLite ledger"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "mutagen>=1.47,<2", "python-dotenv>=1.1,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]

[project.scripts]
dj-sync = "dj_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
